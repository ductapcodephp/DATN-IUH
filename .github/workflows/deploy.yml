name: CI/CD Pipeline Laravel WSL

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ductapdevops/datn-devops:latest

  deploy-local:
    name: Deploy to WSL Server
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Checkout code (để sync config files)
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Sync config files & Deploy
        run: |
          # Sync nginx config từ repo sang server
          cp repo/docker/nginx/default.conf ~/app/docker/nginx/default.conf

          # Pull image mới và deploy
          cd ~/app
          docker compose pull
          docker compose up -d --remove-orphans

          # Chạy migrate tự động sau khi deploy code mới
          docker exec laravel_app php artisan migrate --force

          docker image prune -f

          docker exec laravel_app php artisan storage:link 2>/dev/null || true