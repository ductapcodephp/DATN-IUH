name: CI/CD Pipeline cho Laravel

on:
  push:
    branches:
      - main 
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Đăng nhập vào Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build và Push Image lên Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ductapdevops/datn-devops:latest 

  deploy-to-render:
    name: Trigger Deploy sang Render
    needs: build-and-push 
    runs-on: ubuntu-latest   
    steps:
      - name: Gọi Deploy Webhook của Render
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"